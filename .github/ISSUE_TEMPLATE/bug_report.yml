name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please search the existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open kfm.def
        2. Go to the Animations editor
        3. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error message or traceback
      description: If a message or traceback appeared, paste it here.
      render: text
  - type: input
    id: version
    attributes:
      label: Char Factory version
      placeholder: "0.1.0, or the commit when running from source"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it
      options:
        - Release (.exe)
        - From source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: input
    id: engine
    attributes:
      label: Engine
      placeholder: "MUGEN 1.1, MUGEN 1.0, WinMUGEN, Ikemen GO 0.99..."
  - type: markdown
    attributes:
      value: If the problem happens with a specific character, attach it (zip) or link to it.
