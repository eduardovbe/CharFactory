[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "charfactory"
dynamic = ["version"]
description = "Char Factory: M.U.G.E.N character editor (sprites, animations, sounds, states) with a simulator, a CLI and AI agents (Claude, Codex, Gemini) through MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eduardovbe" }]
requires-python = ">=3.11"
dependencies = ["pillow>=10", "numpy>=2", "scipy>=1.12"]
keywords = ["mugen", "ikemen", "fighting-game", "character-editor", "sff", "sprites", "mcp", "ai-agent", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: Spanish",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Editors",
]

[project.urls]
Homepage = "https://github.com/eduardovbe/CharFactory"
Issues = "https://github.com/eduardovbe/CharFactory/issues"
Changelog = "https://github.com/eduardovbe/CharFactory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8"]
test = ["pytest>=8"]

[project.scripts]
charfactory = "charfactory.cli:main"

[project.gui-scripts]
charfactory-gui = "charfactory.gui.launch:main"

[tool.setuptools.dynamic]
version = { attr = "charfactory.__version__" }

[tool.setuptools.packages.find]
include = ["charfactory*"]

[tool.setuptools.package-data]
charfactory = ["data/*.json", "data/docs_i18n/*.json", "locale/*.json", "gui/themes/*.json", "gui/fonts/*", "gui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
